name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CAMERAS_ENV: testing
  DB_HOST: 127.0.0.1
  DB_NAME: cftv_gml_test
  DB_USER: root
  DB_PASS: root
  APP_TIMEZONE: America/Sao_Paulo
  CAMERAS_SESSION_TIMEOUT: 3600
  CAMERAS_SESSION_ABSOLUTE_TIMEOUT: 28800

jobs:
  php:
    name: PHP Checks
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cftv_gml_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: pdo_mysql, mbstring, zip, gd, xml, curl
          tools: composer:v2
          coverage: pcov

      - name: Validate composer files
        run: composer validate --strict

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress

      - name: Create .env for testing
        run: |
          sudo mkdir -p /etc/sistema-cameras
          sudo tee /etc/sistema-cameras/.env > /dev/null << 'ENVEOF'
          CAMERAS_ENV=testing
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_NAME=cftv_gml_test
          DB_USER=root
          DB_PASS=root
          ENVEOF

      - name: PHP syntax check
        run: find api config src inc auth accounts database -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: PHPStan analysis
        run: vendor/bin/phpstan analyse --no-progress

      - name: PHPUnit tests
        run: vendor/bin/phpunit --coverage-clover coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-coverage
          path: coverage.xml
          if-no-files-found: ignore

  smoke:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: php
    defaults:
      run:
        working-directory: /home/runner/work/sistema-cameras-v1.0/sistema-cameras-v1.0

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cftv_gml_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: pdo_mysql, mbstring, zip, gd, xml, curl
          tools: composer:v2

      - name: Create .env for testing
        run: |
          sudo mkdir -p /etc/sistema-cameras
          sudo tee /etc/sistema-cameras/.env > /dev/null << 'ENVEOF'
          CAMERAS_ENV=testing
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_NAME=cftv_gml_test
          DB_USER=root
          DB_PASS=root
          ENVEOF

      - name: Start PHP dev server
        run: |
          php -S 127.0.0.1:8080 -t public > /tmp/php-server.log 2>&1 &
          sleep 3

      - name: Run Smoke Test (bash)
        run: |
          bash tests/smoke_basico.sh http://127.0.0.1:8080

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'  # cssnano 8 requires Node ^22.11.0 || ^24.11.0 || >=26.0

      - name: Install dependencies
        run: |
          npm ci

      - name: Vitest tests
        run: npm test -- --run

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Vite build
        run: npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: app:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
