name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CAMERAS_ENV: testing
  DB_HOST: 127.0.0.1
  DB_NAME: cftv_gml_test
  DB_USER: root
  DB_PASS: root
  APP_TIMEZONE: America/Sao_Paulo
  CAMERAS_SESSION_TIMEOUT: 3600
  CAMERAS_SESSION_ABSOLUTE_TIMEOUT: 28800

jobs:
  php:
    name: PHP Checks
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cftv_gml_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: pdo_mysql, mbstring, zip, gd, xml, curl
          tools: composer:v2
          coverage: none

      - name: Validate composer files
        run: composer validate --strict

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress

      - name: Create .env for testing
        run: |
          mkdir -p "$HOME/env/sistema-cameras"
          cat > "$HOME/env/sistema-cameras/.env" << 'ENVEOF'
          CAMERAS_ENV=testing
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_NAME=cftv_gml_test
          DB_USER=root
          DB_PASS=root
          ENVEOF

      - name: PHP syntax check
        run: find api config src inc auth accounts -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: PHPStan analysis
        run: vendor/bin/phpstan analyse --no-progress

      - name: PHPUnit tests
        run: vendor/bin/phpunit --no-coverage

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Vite build
        run: npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: app:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
