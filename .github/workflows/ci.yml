name: CI / Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 6 * * 1'  # Semanal às segundas 06:00 UTC

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  php-deps:
    name: PHP Dependencies (composer audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, zip, gd, xml, curl, apcu
          ini-values: memory_limit=256M
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Composer Audit
        # Bloqueia apenas em vulnerabilidades CRITICAL/HIGH (ignora LOW/MEDIUM)
        run: composer audit --no-dev --ignore-severity=low --ignore-severity=medium --format=plain

  node-deps:
    name: Node Dependencies (npm audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: NPM Audit (production only)
        # Bloqueia apenas em vulnerabilidades HIGH/CRITICAL
        run: npm audit --audit-level=high --omit=dev

      - name: NPM Audit (all)
        run: npm audit --audit-level=moderate
        continue-on-error: true

  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Trivy vulnerability scanner (fs)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: true
          hide-progress: true

      - name: Upload Trivy FS results to GitHub Security
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-fs.sarif'
          category: trivy-fs

  trivy-image:
    name: Trivy Image Scan (prod)
    runs-on: ubuntu-latest
    needs: [php-deps, node-deps]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    continue-on-error: true
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image (main Dockerfile --target prod)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: prod
          load: true
          tags: sistema-cameras:prod-scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner (image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'image'
          scan-ref: 'sistema-cameras:prod-scan'
          format: 'sarif'
          output: 'trivy-image.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: true
          hide-progress: true

      - name: Upload Trivy Image results to GitHub Security
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-image.sarif'
          category: trivy-image

  hadolint:
    name: Hadolint (Dockerfile lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/Dockerfile.nginx
          failure-threshold: error
          verbose: true

      - name: Run Hadolint (dev Dockerfile)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error
          verbose: true

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [php-deps, node-deps, trivy-fs, trivy-image, hadolint]
    if: always()
    steps:
      - name: Check job statuses
        run: |
          echo "=== Security Scan Summary ==="
          echo "PHP Deps: ${{ needs.php-deps.result }}"
          echo "Node Deps: ${{ needs.node-deps.result }}"
          echo "Trivy FS: ${{ needs.trivy-fs.result }} (non-blocking)"
          echo "Trivy Image: ${{ needs.trivy-image.result }} (non-blocking)"
          echo "Hadolint: ${{ needs.hadolint.result }}"
          
          # Only block on php-deps, node-deps, hadolint (trivy is informational)
          if [[ "${{ needs.php-deps.result }}" != "success" ]] || \
             [[ "${{ needs.node-deps.result }}" != "success" ]] || \
             [[ "${{ needs.hadolint.result }}" != "success" ]]; then
            echo "::error::Blocking security checks failed"
            exit 1
          fi
          echo "All blocking security checks passed!"