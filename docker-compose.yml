# ============================================
#Desenvolvimento — Apache 2 + PHP 8.3 + MySQL 8.0
#Otimizado para WSL2: network_mode: host evita o netavark/nftables
#(que falha em rootless Podman no WSL2). Bind mount do codigo-fonte
#permite hot reload sem rebuild.
#
#Uso:
#  docker compose up -d
#  docker compose logs -f app
#  docker compose down
#============================================
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    network_mode: host
    command: ["--event-scheduler=ON"]
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${DB_NAME:-cftv_gml}
      MYSQL_USER: ${DB_USER:-cftv_user}
      MYSQL_PASSWORD: ${DB_PASS:-cftv_pass}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./config/DB/cftv_gml.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    network_mode: host
    environment:
      CAMERAS_ENV: development
      # network_mode: host -> DB acessivel em 127.0.0.1:3306 (nao por nome DNS)
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-cftv_gml}
      DB_USER: ${DB_USER:-cftv_user}
      DB_PASS: ${DB_PASS:-cftv_pass}
      APP_TIMEZONE: America/Sao_Paulo
      CAMERAS_SESSION_TIMEOUT: 3600
      CAMERAS_SESSION_ABSOLUTE_TIMEOUT: 28800
      # Em dev, permitir inline styles para evitar quebrar Bootstrap
      CAMERAS_CSP_ALLOW_INLINE_STYLES: 1
    volumes:
      # Bind mount do codigo-fonte — mudancas refletem sem rebuild
      - ./:/var/www/html
      # Persistir storage e uploads (nao sobrescrever com bind mount)
      - app_storage:/var/www/html/storage
      - app_uploads:/var/www/html/public/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
  app_storage:
  app_uploads:
