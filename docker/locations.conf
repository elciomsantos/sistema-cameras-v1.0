# ============================================
    # Configuracao compartilhada de site (raiz + locations).
    # Incluida DENTRO do bloco server (HTTP 8080 ou HTTPS 8443),
    # gerado pelo docker/nginx-entrypoint.sh em /run/nginx_conf.
    # ============================================
    root /var/www/html/public;
    index index.php index.html;

    # Desabilitar directory listing (Options -Indexes)
    autoindex off;

    # ============================================
    # sw-assets.json — permitido para PWA
    # (deve vir antes dos blocos de bloqueio)
    # ============================================
    location = /sw-assets.json {
        try_files $uri =404;
    }

    # ============================================
    # Seguranca: bloquear arquivos sensiveis
    # .env, .sql, .md, .log, .yml, .yaml, .json, .lock
    # ============================================
    location ~* \.(env|sql|md|log|yml|yaml|json|lock)$ {
        deny all;
    }

    # Bloquear dotfiles (incluindo .htaccess)
    location ~ /\. {
        deny all;
    }

    # ============================================
    # Seguranca: bloquear pastas internas
    # ============================================
    location ~ ^/(config|inc|src|accounts|auth|api|scripts)/ {
        deny all;
    }

    # ============================================
    # Uploads: bloquear acesso direto
    # (exceto via api_servir_anexo autenticado)
    # ============================================
    location /uploads/ {
        deny all;
    }

    # ============================================
    # Assets do Vite — cache imutavel
    # ============================================
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Vary "Accept-Encoding";
        try_files $uri =404;
    }

    # ============================================
    # Fonts — cache longo
    # ============================================
    location ~* \.(ttf|otf|woff|woff2|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000";
        add_header Vary "Accept-Encoding";
        try_files $uri =404;
    }

    # ============================================
    # Imagens — cache longo
    # ============================================
    location ~* \.(png|jpg|jpeg|gif|webp|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000";
        try_files $uri =404;
    }

    # ============================================
    # CSS/JS — cache longo
    # ============================================
    location ~* \.(css|js)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000";
        add_header Vary "Accept-Encoding";
        try_files $uri =404;
    }

    # ============================================
    # PHP-FPM — DEVE vir antes do bloco de
    # bloqueio de executaveis
    # O nginx monta $https automaticamente ("on" em conexoes TLS),
    # entao o cookie Secure e o HSTS da aplicacao funcionam no HTTPS.
    # ============================================
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Headers de seguranca
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ============================================
    # Bloquear executaveis (excepto .php acima)
    # Nginx avalia regex em ordem — .php ja foi
    # tratado pelo bloco anterior
    # ============================================
    location ~* \.(phtml|php3|php4|php5|php7|phps|pl|cgi|py|rb|asp|aspx|sh|bat|exe|cmd|com)$ {
        deny all;
    }

    # ============================================
    # Front controller: tudo vai para index.php
    # ============================================
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }