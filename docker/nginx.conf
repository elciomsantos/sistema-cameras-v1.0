# Carregar modulos dinamicos do nginx (brotli, etc.)
load_module modules/ngx_http_brotli_static_module.so;

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Ocultar versao do Nginx
    server_tokens off;

    # ============================================
    # gzip — compressao on-the-fly (mod_deflate)
    # ============================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/css
        text/javascript
        text/xml
        text/plain
        application/javascript
        application/json
        application/xml
        application/xhtml+xml
        application/vnd.ms-fontobject
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2;

    # Brotli static (servir arquivos .br precomprimidos)
    brotli_static on;
    # gzip static (servir arquivos .gz precomprimidos)
    gzip_static on;

    # Ocultar headers do PHP-FPM
    fastcgi_hide_header X-Powered-By;

    # Incluir configs de server
    include /etc/nginx/conf.d/*.conf;
}
